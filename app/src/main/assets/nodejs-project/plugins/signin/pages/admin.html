<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>签到插件设置</title>
<style>
  body{font-family:system-ui,sans-serif;background:#121212;color:#e8eaed;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center}
  .card{background:#1e1e1e;border-radius:20px;padding:24px;width:100%;max-width:420px;margin-top:24px}
  h2{margin:0 0 16px;font-size:20px}
  label{display:block;font-size:13px;color:#9aa0a6;margin:14px 0 6px}
  input{width:100%;background:#2a2a2a;border:1px solid #3c4043;border-radius:12px;color:#e8eaed;padding:12px;font-size:15px;box-sizing:border-box}
  input:focus{outline:none;border-color:#8ab4f8}
  button{width:100%;background:#8ab4f8;color:#0b0b0b;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600;margin-top:18px;cursor:pointer}
  #msg{margin-top:12px;font-size:13px;min-height:18px}.ok{color:#81c995}.err{color:#f28b82}
  .hint{font-size:12px;color:#9aa0a6;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h2>⚙️ 每日签到 · 设置</h2>
  <label>访问令牌 (webToken)</label>
  <input id="ak" type="password" placeholder="管理端 webToken">
  <label>每次签到奖励额度 (tokens)</label>
  <input id="reward" type="number" min="0" placeholder="1000">
  <button id="save">保存设置</button>
  <div id="msg"></div>
  <div class="hint">提示：本页是插件自定义设置页示例。<br>若插件只声明 configSchema 不提供本页，App 会自动生成表单。</div>
</div>
<script>
const $ = id => document.getElementById(id);
//// derive the instance name (/admin/... = default, no prefix; /<inst>/plugins/signin/... has one)
const m = location.pathname.match(/^\/([^/]+)\/plugins\//);
const INST = m ? m[1] : 'default';
const API = (INST === 'default' ? '' : '/' + INST) + '/admin/api/plugins-config/' + INST + '/signin';
$('ak').value = localStorage.getItem('signin_admin_key') || '';

async function load() {
  const ak = $('ak').value.trim(); if (!ak) return;
  const r = await fetch(API, { headers: { 'x-agw-token': ak } }).then(r => r.json()).catch(() => null);
  if (r && r.config) $('reward').value = r.config.rewardTokens ?? 1000;
}
$('save').onclick = async () => {
  const ak = $('ak').value.trim();
  if (!ak) { $('msg').textContent = '请填 webToken'; $('msg').className = 'err'; return; }
  localStorage.setItem('signin_admin_key', ak);
  const body = { config: { rewardTokens: Math.max(0, parseInt($('reward').value) || 1000) } };
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-agw-token': ak }, body: JSON.stringify(body) }).then(r => r.json()).catch(() => null);
  if (r && r.ok) { $('msg').textContent = '✓ 已保存（实例热重载后生效）'; $('msg').className = 'ok'; }
  else { $('msg').textContent = '保存失败: ' + ((r && r.error) || '网络错误'); $('msg').className = 'err'; }
};
$('ak').onchange = load; load();
</script>
</body>
</html>
